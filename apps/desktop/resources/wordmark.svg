  </g>

  <!-- Subtitle -->
  <g transform="translate(140, 70)">
    <text x="0" y="0" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="9" font-weight="600" fill="#64748b" text-anchor="middle" letter-spacing="0.3em">AGENTIC CODING AI</text>
    <path d="M -115,-3 L -85,-3" stroke="#64748b" stroke-width="1" />
    <path d="M -115,-3 L -110,-6 M -115,-3 L -110,0" stroke="#64748b" stroke-width="1" fill="none" />
    
    <path d="M 85,-3 L 115,-3" stroke="#64748b" stroke-width="1" />
    <path d="M 115,-3 L 110,-6 M 115,-3 L 110,0" stroke="#64748b" stroke-width="1" fill="none" />

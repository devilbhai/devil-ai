      }
      @media (prefers-color-scheme: dark) {
        .wordmark-text {
          fill: #f8fafc;
        }
      }
    </style>
  </defs>

  <g transform="translate(23, 20)">
    <!-- D -->
    <path class="wordmark-text" d="M 0,0 L 16,0 Q 32,0 32,16 Q 32,32 16,32 L 0,32 Z M 6,26 L 16,26 Q 25,26 25,16 Q 25,6 16,6 L 6,6 Z" />
    
    <!-- E -->
    <path class="wordmark-text" transform="translate(42, 0)" d="M 0,0 L 26,0 L 26,5 L 6,5 L 6,13 L 22,13 L 22,18 L 6,18 L 6,27 L 26,27 L 26,32 L 0,32 Z" />
    
    <!-- V -->
    <path class="wordmark-text" transform="translate(78, 0)" d="M 0,0 L 8,0 L 16,22 L 24,0 L 32,0 L 19,32 L 13,32 Z" />
    
    <!-- I -->
    <path class="wordmark-text" transform="translate(120, 0)" d="M 0,0 L 6,0 L 6,32 L 0,32 Z" />
    
    <!-- L -->
    <path class="wordmark-text" transform="translate(136, 0)" d="M 0,0 L 6,0 L 6,27 L 26,27 L 26,32 L 0,32 Z" />
    
    <!-- A -->

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Devil AI Browser Control</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      width: 320px;
      padding: 16px;
      background: #1a1a2e;
      color: #eaeaea;
    }
    .header {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 16px;
      padding-bottom: 12px;
      border-bottom: 1px solid #333;
    }
    .logo { width: 32px; height: 32px; background: linear-gradient(135deg, #667eea, #764ba2); border-radius: 8px; display: flex; align-items: center; justify-content: center; }
    .logo svg { width: 20px; height: 20px; }
    h1 { font-size: 16px; font-weight: 600; }
    .status {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 10px;
      background: #16213e;
      border-radius: 8px;
      margin-bottom: 16px;
    }
    .status-dot { width: 10px; height: 10px; border-radius: 50%; background: #ef4444; }
    .status-dot.connected { background: #22c55e; }
    .status-text { font-size: 13px; color: #9ca3af; }
    .btn {
      width: 100%;
      padding: 10px 16px;
      border: none;
      border-radius: 6px;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.15s;
      margin-bottom: 8px;
    }
    .btn-primary {
      background: linear-gradient(135deg, #667eea, #764ba2);
      color: white;
    }
    .btn-primary:hover { opacity: 0.9; transform: translateY(-1px); }
    .btn-secondary {
      background: #1f2937;
      color: #e5e7eb;
      border: 1px solid #374151;
    }
    .btn-secondary:hover { background: #374151; }
    .btn:disabled { opacity: 0.5; cursor: not-allowed; }
    .tabs-list { list-style: none; max-height: 200px; overflow-y: auto; margin-bottom: 16px; }
    .tab-item {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 8px 10px;
      background: #16213e;
      border-radius: 6px;
      margin-bottom: 6px;
      cursor: pointer;
      transition: background 0.15s;
    }
    .tab-item:hover { background: #1f2937; }
    .tab-item.active { border: 1px solid #667eea; }
    .tab-favicon { width: 16px; height: 16px; border-radius: 3px; object-fit: cover; }
    .tab-title { flex: 1; font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .tab-url { font-size: 11px; color: #6b7280; max-width: 150px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .divider { height: 1px; background: #333; margin: 16px 0; }
    .section-title { font-size: 11px; text-transform: uppercase; letter-spacing: 0.05em; color: #6b7280; margin-bottom: 8px; }
    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }
    .loading { animation: pulse 1.5s infinite; }
  </style>
</head>
<body>
  <div class="header">
    <div class="logo">
      <svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2">
        <polygon points="23 4 12 19.21 1 4 12 1.79 23 4"/>
      </svg>
    </div>
    <h1>Devil AI Browser</h1>
  </div>

  <div class="status">
    <div class="status-dot" id="statusDot"></div>
    <span class="status-text" id="statusText">Connecting...</span>
  </div>

  <div class="section-title">Open Tabs</div>
  <ul class="tabs-list" id="tabsList">
    <li class="tab-item loading" style="justify-content: center; color: #6b7280;">Loading tabs...</li>
  </ul>

  <div class="divider"></div>

  <div class="section-title">Actions</div>
  <div class="grid">
    <button class="btn btn-primary" id="btnNewTab">+ New Tab</button>
    <button class="btn btn-secondary" id="btnRefresh">↻ Refresh</button>
  </div>
  <button class="btn btn-primary" id="btnScreenshot" style="margin-top: 8px;">📷 Screenshot Active Tab</button>
  <button class="btn btn-secondary" id="btnGetTabs" style="margin-top: 8px;">📋 Get All Tabs</button>

  <div class="divider"></div>

  <div class="section-title">Quick Actions</div>
  <div class="grid">
    <button class="btn btn-secondary" id="btnClick">👆 Click</button>
    <button class="btn btn-secondary" id="btnType">⌨ Type</button>
  </div>
  <button class="btn btn-secondary" id="btnEval" style="margin-top: 8px;">🔧 Evaluate JS</button>

  <script>
    let tabs = []
    let activeTabId = null
    let ws = null

    const statusDot = document.getElementById('statusDot')
    const statusText = document.getElementById('statusText')
    const tabsList = document.getElementById('tabsList')

    // Connect to background
    chrome.runtime.sendMessage({ type: 'getTabs' }, (response) => {
      if (response) {
        tabs = response
        renderTabs()
      }
    })

    // Listen for tab updates
    chrome.tabs.onUpdated.addListener(() => refreshTabs())
    chrome.tabs.onCreated.addListener(() => refreshTabs())
    chrome.tabs.onRemoved.addListener(() => refreshTabs())
    chrome.tabs.onActivated.addListener(() => refreshTabs())

    async function refreshTabs() {
      chrome.runtime.sendMessage({ type: 'getTabs' }, (response) => {
        if (response) {
          tabs = response
          renderTabs()
        }
      })
    }

    function renderTabs() {
      if (tabs.length === 0) {
        tabsList.innerHTML = '<li class="tab-item" style="justify-content: center; color: #6b7280;">No tabs open</li>'
        return
      }

      tabsList.innerHTML = tabs.map(tab => `
        <li class="tab-item ${tab.active ? 'active' : ''}" data-tab-id="${tab.id}">
          ${tab.favicon ? `<img class="tab-favicon" src="${tab.favicon}" onerror="this.style.display='none'">` : ''}
          <span class="tab-title" title="${tab.title}">${tab.title || 'New Tab'}</span>
          <span class="tab-url">${new URL(tab.url).hostname}</span>
        </li>
      `).join('')

      // Add click handlers
      document.querySelectorAll('.tab-item').forEach(item => {
        item.addEventListener('click', () => {
          const tabId = parseInt(item.dataset.tabId)
          switchTab(tabId)
        })
      })

      // Update active tab
      activeTabId = tabs.find(t => t.active)?.id || tabs[0]?.id
    }

    async function switchTab(tabId) {
      chrome.tabs.update(tabId, { active: true })
      refreshTabs()
    }

    // Button handlers
    document.getElementById('btnNewTab').addEventListener('click', () => {
      chrome.tabs.create({ url: 'https://github.com', active: true })
    })

    document.getElementById('btnRefresh').addEventListener('click', refreshTabs)

    document.getElementById('btnScreenshot').addEventListener('click', async () => {
      if (!activeTabId) return
      const btn = document.getElementById('btnScreenshot')
      btn.textContent = '📷 Capturing...'
      btn.disabled = true

      chrome.runtime.sendMessage({ action: 'screenshot', tabId: activeTabId }, (response) => {
        if (response?.data) {
          const link = document.createElement('a')
          link.href = 'data:image/png;base64,' + response.data
          link.download = `screenshot-${Date.now()}.png`
          link.click()
        }
        btn.textContent = '📷 Screenshot Active Tab'
        btn.disabled = false
      })
    })

    document.getElementById('btnGetTabs').addEventListener('click', () => {
      console.log('Tabs:', tabs)
      alert(`Total tabs: ${tabs.length}`)
    })

    document.getElementById('btnClick').addEventListener('click', async () => {
      if (!activeTabId) return
      const selector = prompt('CSS selector to click:')
      if (selector) {
        chrome.runtime.sendMessage({ action: 'click', tabId: activeTabId, selector })
      }
    })

    document.getElementById('btnType').addEventListener('click', async () => {
      if (!activeTabId) return
      const selector = prompt('CSS selector to type in:')
      if (!selector) return
      const text = prompt('Text to type:')
      if (text) {
        chrome.runtime.sendMessage({ action: 'type', tabId: activeTabId, selector, text })
      }
    })

    document.getElementById('btnEval').addEventListener('click', async () => {
      if (!activeTabId) return
      const script = prompt('JavaScript to evaluate:')
      if (script) {
        chrome.runtime.sendMessage({ action: 'evaluate', tabId: activeTabId, script }, (response) => {
          if (response?.result !== undefined) {
            alert('Result: ' + JSON.stringify(response.result, null, 2))
          }
        })
      }
    })
  </script>
</body>
</html>
